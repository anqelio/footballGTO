volumes:
  postgres-data:
    name: football-postgres-data
services:
  api:
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy
  web:
    volumes:
      - ./web:/app
    depends_on:
      db:
        condition: service_healthy
  db:
    networks:
      - internal
    env_file:
      - .env
    logging:
      options:
        max-size: "5m"
        max-file: "2"
    image: postgres:18.6-alpine3.24
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    command: [
      "postgres",
      "-p", "${POSTGRES_PORT}",
      "-c", "log_statement=all",
      "-c", "timezone=${TZ}",
      "-c", "log_timezone=${TZ}"
    ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p $${POSTGRES_PORT} -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
